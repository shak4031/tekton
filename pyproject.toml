[project]
name = "tekton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openhands-agent-server>=1.36.1",
    "openhands-sdk>=1.36.1",
    "openhands-tools>=1.36.1",
    "openhands-workspace>=1.36.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.16.3",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = ["probes", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "D", "PL", "I", "B", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekton_runner"]
