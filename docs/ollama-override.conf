# Rig Ollama drop-in: /etc/systemd/system/ollama.service.d/override.conf
# OLLAMA_CONTEXT_LENGTH is load-bearing. Without it the server defaults to
# 4096, halves it per slot, and SILENTLY truncates the agent's ~7100-token
# prompt to 2050 - which is why D3.1's hello-world never actually executed.
# Found 2026-08-30 at D3.4 slice 5. Not a deployment mechanism, just a record.

[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=15m"
Environment="OLLAMA_HOST=0.0.0.0"
Environment="OLLAMA_CONTEXT_LENGTH=16384"
